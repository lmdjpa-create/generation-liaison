<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Réinitialiser le mot de passe</title>
  <script src="/language.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #f3f7fa; color: #233344; padding: 24px; }
    main { max-width: 460px; margin: 8vh auto; background: white; border-radius: 16px; padding: 24px; }
    form { display: grid; gap: 12px; }
    input, button { font: inherit; padding: 12px; }
    button { background: #247db5; color: white; border: 0; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: .6; }
    [hidden] { display: none !important; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body><header style="background:#fff;text-align:center;padding:4px 0;box-shadow:0 4px 14px rgba(31,58,77,.06)"><a href="/"><img src="/logo-generation-liaison.jpg" alt="Génération Liaison" width="240" height="240" style="display:block;margin:0 auto;height:200px;width:auto;max-width:100%"></a></header>
  <main>
    <h1>Réinitialiser le mot de passe</h1>
    <form id="request-form">
      <label for="email">Saisissez l’adresse e-mail de votre compte.</label>
      <input id="email" type="email" autocomplete="email" required maxlength="254">
      <button type="submit">Envoyer le lien</button>
    </form>
    <form id="reset-form" hidden>
      <label for="password">Nouveau mot de passe</label>
      <input id="password" type="password" autocomplete="new-password" required minlength="12" maxlength="256">
      <label for="confirm-password">Confirmer le nouveau mot de passe</label>
      <input id="confirm-password" type="password" autocomplete="new-password" required minlength="12" maxlength="256">
      <button type="submit">Enregistrer le mot de passe</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <a href="/app-mobile.html">Retour à la connexion</a>
  </main>
  <script>
    const SERVER_URL = window.APP_API_BASE_URL || window.location.origin;
    const resetToken = location.hash.slice(1);
    if (location.hash) history.replaceState(null, '', location.pathname);
    const requestForm = document.getElementById('request-form');
    const resetForm = document.getElementById('reset-form');
    const status = document.getElementById('status');
    const translate = text => window.generationLiaisonTranslate ? window.generationLiaisonTranslate(text) : text;
    if (resetToken) {
      requestForm.hidden = true;
      resetForm.hidden = false;
    }

    async function submit(form, endpoint, body) {
      const button = form.querySelector('button');
      button.disabled = true;
      status.textContent = '';
      try {
        const response = await fetch(`${SERVER_URL}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Serveur inaccessible. Réessayez.');
        status.textContent = translate(result.message);
        if (form === resetForm) form.hidden = true;
      } catch (error) {
        status.textContent = translate(error.message || 'Serveur inaccessible. Réessayez.');
      } finally {
        button.disabled = false;
      }
    }

    requestForm.addEventListener('submit', event => {
      event.preventDefault();
      submit(requestForm, '/api/auth/password-reset/request', { email: document.getElementById('email').value });
    });
    resetForm.addEventListener('submit', event => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      if (password !== document.getElementById('confirm-password').value) {
        status.textContent = translate('Les mots de passe ne correspondent pas.');
        return;
      }
      submit(resetForm, '/api/auth/password-reset/confirm', { token: resetToken, password });
    });
  </script>
</body>
</html>
